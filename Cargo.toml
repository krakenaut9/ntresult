[package]
name = "kerror"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Lightweight NTSTATUS-based error handling for Windows kernel-mode Rust code."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/krakenaut9/kerror"
documentation = "https://docs.rs/kerror"
# crates.io allows at most 5 keywords.
keywords = ["ntstatus", "windows", "kernel", "driver", "error-handling"]
categories = ["no-std", "os::windows-apis", "rust-patterns"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]
authors = ["Dmytro Maslo <krakenaut9@gmail.com>"]

[dependencies]
# Only `NTSTATUS` and the `STATUS_*` constants are needed; the umbrella `Win32`
# feature would pull in the entire Win32 surface and slow every downstream build.
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[features]
# All features are additive: each one only adds `From` conversions into `Error`.
# Every feature except `allocator-api` builds on stable Rust.
default = ["alloc", "integer"]

# Conversion from `alloc::collections::TryReserveError`.
alloc = []
# Conversion from `core::alloc::AllocError`.
# Requires a NIGHTLY compiler: enables the unstable `allocator_api` language
# feature. Independent of `alloc` -- `AllocError` lives in `core`.
allocator-api = []
# Conversion from `core::net::AddrParseError`.
addr-parse = []
# Conversion from `core::num::TryFromIntError`.
integer = []

[package.metadata.docs.rs]
# docs.rs defaults to a Linux target with default features only, which would
# document neither the gated conversions nor the platform this crate targets.
# docs.rs builds on nightly, so `all-features` (incl. `allocator-api`) is safe.
all-features = true
targets = ["x86_64-pc-windows-msvc"]
# Enables the `doc_cfg` feature badges ("Available on crate feature ... only").
rustdoc-args = ["--cfg", "docsrs"]
