[package]
name = "ntresult"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight NTSTATUS-based error handling for Windows kernel-mode Rust code."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/krakenaut9/ntresult"
documentation = "https://docs.rs/ntresult"
keywords = ["ntstatus", "windows", "kernel", "driver", "error-handling"]
categories = ["no-std", "os::windows-apis", "rust-patterns"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE*"]
authors = ["Dmytro Maslo <krakenaut9@gmail.com>"]

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[features]
# Empty on purpose: pulling in the `alloc` crate makes rustc demand a
# `#[global_allocator]` from every final artifact, even one that never
# allocates. The core `NTSTATUS` wrapper needs no allocator.
default = []

alloc = []
# Requires nightly: enables the unstable `allocator_api` feature.
allocator-api = []

# Kept here rather than in a CI command line so that a local `cargo clippy`
# matches CI. Groups take priority -1 so the `allow`s below can override them.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-pc-windows-msvc"]
rustdoc-args = ["--cfg", "docsrs"]
