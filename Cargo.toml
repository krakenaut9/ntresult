[package]
name = "kerror"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Lightweight NTSTATUS-based error handling for Windows kernel-mode Rust code."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/krakenaut9/kerror"
homepage = "https://github.com/krakenaut9/kerror"
documentation = "https://docs.rs/kerror"
keywords = ["error", "error-handling", "windows", "ntstatus", "kernel", "driver", "no-std"]
categories = ["no-std"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE*"]
authors = ["Dmytriy Maslo <krakenaut9@gmail.com>"]

[dependencies]
windows-sys = { version = "0.61", features = ["Win32"] }

[features]
# All features are additive: each one only adds `From` conversions into `Error`.
# Every feature except `allocator-api` builds on stable Rust.
default = ["alloc", "integer"]

# Conversion from `alloc::collections::TryReserveError`.
alloc = []
# Conversion from `core::alloc::AllocError`.
# Requires a NIGHTLY compiler: enables the unstable `allocator_api` language
# feature. Independent of `alloc` -- `AllocError` lives in `core`.
allocator-api = []
# Conversion from `core::net::AddrParseError`.
addr-parse = []
# Conversion from `core::num::TryFromIntError`.
integer = []
